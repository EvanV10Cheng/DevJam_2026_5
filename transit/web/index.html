<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>大台北即時轉乘</title>
  <style>
    /* TODO(P3)：樣式自由發揮 */
  </style>
</head>
<body>
  <h1>大台北即時轉乘</h1>

  <!-- 查詢區（步驟 3.1） -->
  <form id="query-form">
    <input id="origin" value="台北車站" placeholder="起點">
    <input id="destination" value="淡水捷運站" placeholder="終點">
    <button id="submit" type="submit">查詢</button>
  </form>

  <!-- reordered 提示條（步驟 3.6）：reordered 為 true 才顯示 -->
  <div id="reorder-banner" hidden>依即時到站重新排序後，最快方案與原始建議不同</div>

  <!-- 錯誤與空結果（步驟 3.9） -->
  <p id="error" hidden></p>
  <p id="empty" hidden>找不到路線</p>

  <!-- 方案卡片列表（步驟 3.3） -->
  <div id="plans"></div>

  <script src="./app.js"></script>
</body>
</html>
