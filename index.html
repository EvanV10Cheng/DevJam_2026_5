<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大台北即時轉乘系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== 固定頁首：Header + 功能導覽列一起 sticky，下滑頁面不會移動 ===== -->
  <div class="site-header">
    <!-- ===== Header：品牌 + 即時時鐘（本系統核心賣點的視覺化身） ===== -->
    <header class="topbar">
      <div class="topbar__inner">
        <div class="wordmark">大台北即時轉乘系統</div>
        <div class="live-clock" id="liveClock" aria-label="目前時間">
          <span class="live-clock__label">NOW</span>
          <span class="live-clock__time" id="liveClockTime">--:--:--</span>
        </div>
      </div>
    </header>

    <!-- ===== 功能導覽列：地點搜尋 + 分頁切換（未來擴充功能的入口） ===== -->
    <nav class="utility-nav" aria-label="功能導覽">
      <div class="utility-nav__inner">
        <div class="utility-nav__search">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" class="utility-nav__search-icon">
            <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
            <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input type="text" class="utility-nav__search-input" placeholder="地點查詢／站名時刻表">
        </div>

        <div class="utility-nav__tabs">
          <button type="button" class="utility-nav__tab utility-nav__tab--active">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
            <span>路線／票價</span>
          </button>
        </div>
      </div>
    </nav>
  </div>

  <main class="page">

    <!-- ===== 搜尋卡片（查完仍留在畫面上，結果直接往下展開） ===== -->
    <div id="searchView">
      <p class="hero-tagline">即時查詢．台北捷運轉乘</p>
      <section class="search-card" id="searchCard" aria-label="查詢轉乘方案">
      <form id="searchForm" class="search-form" method="get" novalidate>

        <!-- 出發站／到達站 -->
        <div class="search-form__row search-form__row--stations">
          <div class="field-wrap">
            <div class="field field--origin">
              <label class="field__pill field__pill--origin" for="originInput">出發站</label>
              <input
                id="originInput"
                name="origin"
                type="text"
                class="field__input"
                placeholder="輸入車站或地標"
                value="台北車站"
                autocomplete="off"
                required
              >
            </div>
            <ul class="suggestions" id="originSuggestions" hidden></ul>
          </div>

          <button type="button" id="swapBtn" class="swap-btn" aria-label="交換出發與到達">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path d="M4 7h13M17 7l-3.5-3.5M17 7l-3.5 3.5M20 17h-13M7 17l3.5 3.5M7 17l3.5-3.5"
                    fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <div class="field-wrap">
            <div class="field field--destination">
              <label class="field__pill field__pill--destination" for="destinationInput">到達站</label>
              <input
                id="destinationInput"
                name="destination"
                type="text"
                class="field__input"
                placeholder="輸入車站或地標"
                value="淡水捷運站"
                autocomplete="off"
                required
              >
            </div>
            <ul class="suggestions" id="destinationSuggestions" hidden></ul>
          </div>
        </div>

        <!-- 日期（含日曆挑選） -->
        <div class="search-form__row search-form__row--date">
          <span class="row-label">日期</span>
          <div class="date-control">
            <input type="date" id="dateInput" name="date" class="date-control__input" aria-label="選擇日期">
            <button type="button" id="calendarBtn" class="date-control__cal-btn">
              <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
                <rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
                <path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
              日曆
            </button>
          </div>
        </div>

        <!-- 時間 -->
        <div class="search-form__row search-form__row--time">
          <span class="row-label">時間</span>
          <div class="time-control">
            <select id="hourSelect" name="hour" class="time-select" aria-label="小時"></select>
            <span class="time-control__unit">時</span>
            <select id="minuteSelect" name="minute" class="time-select" aria-label="分鐘"></select>
            <span class="time-control__unit">分</span>
            <button type="button" id="nowTimeBtn" class="link-btn">目前時間</button>
          </div>
          <div class="time-mode" role="group" aria-label="時間查詢模式">
            <button type="button" class="time-mode__btn time-mode__btn--active" data-mode="depart">離開</button>
            <button type="button" class="time-mode__btn" data-mode="arrive">到達</button>
          </div>
        </div>

        <!-- 查詢模式不是原生表單元件，用隱藏欄位跟著表單一起送出到網址參數 -->
        <input type="hidden" id="timeModeInput" name="mode" value="depart">

        <button type="submit" class="search-form__submit" id="submitBtn">
          <span id="submitBtnText">查詢轉乘方案</span>
        </button>

        <p class="search-form__error" id="searchError" role="alert" hidden></p>
      </form>

      <!-- 搜尋紀錄 -->
      <div class="quick-examples">
        <div class="quick-examples__header">
          <span class="quick-examples__label">搜尋紀錄</span>
        </div>
        <div class="quick-examples__box">
          <button type="button" class="chip" data-origin="台北車站" data-destination="淡水捷運站">2026年8月17日 15:00 從台北車站出發 ⇒ 淡水捷運站</button>
          <button type="button" class="chip" data-origin="台北車站" data-destination="新竹高鐵站">2026年8月16日 09:30 從台北車站出發 ⇒ 新竹高鐵站</button>
          <button type="button" class="chip" data-origin="台北101" data-destination="士林夜市">2026年8月15日 18:00 從台北101出發 ⇒ 士林夜市</button>
        </div>
      </div>
      </section>

      <section class="mode-legend" aria-label="支援的運具類型">
        <div class="mode-legend__item">
          <span class="mode-dot mode-dot--bus" aria-hidden="true"></span>
          <span>公車</span>
        </div>
        <div class="mode-legend__item">
          <span class="mode-dot mode-dot--metro" aria-hidden="true"></span>
          <span>捷運</span>
        </div>
        <div class="mode-legend__item">
          <span class="mode-dot mode-dot--train" aria-hidden="true"></span>
          <span>台鐵</span>
        </div>
        <div class="mode-legend__item">
          <span class="mode-dot mode-dot--hsr" aria-hidden="true"></span>
          <span>高鐵</span>
        </div>
      </section>
    </div>

    <!-- ===== 結果區（同一頁往下展開，不換頁） ===== -->
    <section id="resultsView" class="results-view" hidden aria-label="路線查詢結果">

      <div class="route-header">
        <div class="route-header__path">
          <span class="route-badge route-badge--origin">離開</span>
          <strong id="resultOrigin" class="route-header__station"></strong>
          <span class="route-header__arrow" aria-hidden="true">›</span>
          <span class="route-badge route-badge--dest">到達</span>
          <strong id="resultDestination" class="route-header__station"></strong>
        </div>
        <button type="button" id="backToSearchBtn" class="route-header__edit">更改搜尋條件</button>
      </div>

      <p class="route-query-bar" id="routeQueryBar"></p>

      <div class="route-tabs" role="tablist" aria-label="路線排序">
        <button type="button" class="route-tabs__btn route-tabs__btn--active" role="tab" aria-selected="true" data-sort="recommended">推薦路線</button>
        <button type="button" class="route-tabs__btn" role="tab" aria-selected="false" data-sort="fastest">最快路線</button>
        <button type="button" class="route-tabs__btn" role="tab" aria-selected="false" data-sort="cheapest">票價較低</button>
        <button type="button" class="route-tabs__btn" role="tab" aria-selected="false" data-sort="fewest">轉乘較少</button>
        <button type="button" class="route-tabs__btn" role="tab" aria-selected="false" data-sort="live">即時優先</button>
      </div>


      <div id="routeSummaryTable" class="route-summary" aria-label="路線一覽"></div>

      <p class="route-footnote">關於時間表修訂 ｜ 關於票價顯示 ｜ 關於定期票價</p>

      <div class="plan-shift">
        <button type="button" id="prevTrainsBtn" class="plan-shift__btn">◀ 前幾班車的出發及抵達時間</button>
        <button type="button" id="nextTrainsBtn" class="plan-shift__btn">接下來幾班車的出發及抵達時間 ▶</button>
      </div>

      <div id="planDetail" class="plan-detail" hidden></div>
    </section>

    <p id="emptyState" class="empty-state" hidden>找不到路線，換個地點再試試。</p>

  </main>

  <!-- ===== Debug 面板（?debug=1 或 Ctrl+Shift+D 開啟） ===== -->
  <aside id="debugPanel" class="debug-panel" hidden aria-label="除錯面板">
    <div class="debug-panel__head">
      <button type="button" id="debugFab" class="debug-panel__title" hidden>DEBUG</button>
      <span class="debug-panel__meta" id="debugMeta">—</span>
      <button type="button" id="debugClearBtn" class="debug-panel__btn">清除</button>
      <button type="button" id="debugCloseBtn" class="debug-panel__btn" aria-label="關閉除錯面板">×</button>
    </div>
    <ol class="debug-panel__log" id="debugLog"></ol>
  </aside>

  <script src="app.js"></script>
</body>
</html>
